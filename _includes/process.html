<section class="process" id="process">
  <div class="section-tag">{{ include.section.tag }}</div>
  <h2 class="section-title">{{ include.section.title_main }} <em>{{ include.section.title_italic }}</em></h2>
  <div class="process-grid">
    <div class="process-steps">
      {% for step in include.section.steps %}
      <div class="process-step">
        <div class="step-num">{{ step.number }}</div>
        <div class="step-content">
          <div class="step-title">{{ step.title }}</div>
          <div class="step-text">{{ step.text }}</div>
        </div>
      </div>
      {% endfor %}
    </div>
    <div class="process-visual">
      <div class="diamond-display">
        <svg class="diamond-svg" width="160" height="160" viewBox="0 0 160 160">
          <polygon points="80,20 140,60 80,145 20,60" fill="none" stroke="#C9A84C" stroke-width="1" opacity="0.9"/>
          <polygon points="80,20 140,60 80,75" fill="rgba(201,168,76,0.06)" stroke="#C9A84C" stroke-width="0.5" opacity="0.6"/>
          <polygon points="80,20 20,60 80,75" fill="rgba(201,168,76,0.04)" stroke="#C9A84C" stroke-width="0.5" opacity="0.4"/>
          <polygon points="140,60 80,75 80,145" fill="rgba(201,168,76,0.08)" stroke="#C9A84C" stroke-width="0.5" opacity="0.5"/>
          <polygon points="20,60 80,75 80,145" fill="rgba(201,168,76,0.05)" stroke="#C9A84C" stroke-width="0.5" opacity="0.4"/>
          <line x1="80" y1="20" x2="80" y2="75" stroke="#C9A84C" stroke-width="0.3" opacity="0.4"/>
          <line x1="20" y1="60" x2="140" y2="60" stroke="#C9A84C" stroke-width="0.3" opacity="0.3"/>
        </svg>
        <div class="diamond-label">crafted to your specifications</div>
      </div>
    </div>
  </div>
</section>
