<section class="testimonials" id="about">
  <div class="section-tag">{{ include.section.tag }}</div>
  <h2 class="section-title">{{ include.section.title_main }} <em>{{ include.section.title_italic }}</em></h2>
  <div class="testimonials-grid">
    {% for review in include.section.reviews %}
    <div class="testimonial">
      <div class="stars">&#9733;&#9733;&#9733;&#9733;&#9733;</div>
      <div class="testimonial-text">{{ review.text }}</div>
      <div class="testimonial-author">
        <div class="author-name">{{ review.name }}</div>
        <div class="author-detail">{{ review.detail }}</div>
      </div>
    </div>
    {% endfor %}
  </div>
</section>
