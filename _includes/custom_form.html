<section class="form-section" id="custom">
  <div class="form-layout">
    <div class="form-intro">
      <div class="section-tag">{{ include.section.tag }}</div>
      <h2 class="section-title">{{ include.section.title_main }} <em>{{ include.section.title_italic }}</em></h2>
      <p class="section-body">{{ include.section.body }}</p>
      <div class="form-features">
        {% for feature in include.section.features %}
        <div class="form-feature">
          <div class="feature-dot"></div>
          <div class="feature-text">{{ feature }}</div>
        </div>
        {% endfor %}
      </div>
    </div>
    
    <form class="custom-form" id="contactForm" onsubmit="handleSubmit(event)">
      <input type="hidden" name="access_key" value="d12f324d-b0bf-47b7-b808-b2de816c60ed">
      <input type="hidden" name="subject" value="New Custom Jewelry Inquiry - Aksaja">

      <div class="form-row">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" name="first_name" placeholder="Your name" required>
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" name="last_name" placeholder="Last name">
        </div>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" placeholder="your@email.com" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Piece Type</label>
          <select name="piece_type" required>
            <option value="">Select type</option>
            <option>Engagement Ring</option>
            <option>Necklace / Pendant</option>
            <option>Birthstone Ring</option>
            <option>Earrings</option>
            <option>Bracelet / Bangle</option>
            <option>Memorial / Tribute Piece</option>
            <option>Anniversary Band</option>
            <option>Other / Not sure</option>
          </select>
        </div>
        <div class="form-group">
          <label>Budget Range</label>
          <select name="budget_range">
            <option value="">Select budget</option>
            <option>Under $500</option>
            <option>$500 – $1,000</option>
            <option>$1,000 – $3,000</option>
            <option>$3,000 – $7,500</option>
            <option>$7,500+</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Preferred Metal</label>
        <select name="preferred_metal">
          <option value="">Select metal</option>
          <option>14k Yellow Gold</option>
          <option>14k White Gold</option>
          <option>14k Rose Gold</option>
          <option>18k Yellow Gold</option>
          <option>18k White Gold</option>
          <option>Platinum</option>
          <option>Sterling Silver</option>
          <option>Not sure — advise me</option>
        </select>
      </div>
      <div class="form-group">
        <label>Tell us about your vision</label>
        <textarea name="vision_description" placeholder="Describe your dream piece — any inspiration, occasion, stones, engravings, or special details you have in mind..."></textarea>
      </div>
      <div class="form-group">
        <label>When do you need it by?</label>
        <input type="text" name="deadline" placeholder="e.g. No rush, or: by December 20th">
      </div>
      <button class="form-submit" type="submit">Submit My Custom Inquiry &#8594;</button>
    </form>
  </div>
</section>

<script>
  async function handleSubmit(e) {
    e.preventDefault();
    const form = e.target;
    const btn = form.querySelector('.form-submit');
    const originalText = btn.textContent;
    
    btn.textContent = 'Sending...';
    btn.style.opacity = '0.7';

    const formData = new FormData(form);

    try {
      const response = await fetch("https://api.web3forms.com/submit", {
        method: "POST",
        body: formData
      });

      if (response.ok) {
        btn.textContent = 'Inquiry Received — We\'ll be in touch within 24 hours';
        btn.style.background = '#2a5c2a';
        btn.style.color = '#90d090';
        btn.style.opacity = '1';
        form.reset(); // Clear the form
      } else {
        throw new Error('Network response was not ok');
      }
    } catch (error) {
      btn.textContent = 'Error sending. Please try again.';
      setTimeout(() => {
        btn.textContent = originalText;
        btn.style.opacity = '1';
      }, 3000);
    }
  }
</script>
