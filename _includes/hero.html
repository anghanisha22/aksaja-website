<section class="hero">
  <div class="hero-bg"></div>
  <div class="hero-lines"></div>
  <div class="hero-content">
    <div class="hero-tag">{{ include.section.tag }}</div>
    <h1 class="hero-title">{{ include.section.title_main }}<em>{{ include.section.title_italic }}</em></h1>
    <p class="hero-subtitle">{{ include.section.subtitle }}</p>
    <div class="hero-btns">
      <a class="btn-primary" href="{{ include.section.btn1_link }}">{{ include.section.btn1_text }}</a>
      <a class="btn-outline" href="{{ include.section.btn2_link }}">{{ include.section.btn2_text }}</a>
    </div>
  </div>
  <div class="hero-scroll">Discover</div>
</section>
